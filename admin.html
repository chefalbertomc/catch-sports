<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Catch Sports</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Force unregister bad Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo-container">
      <div class="logo-icon">
        <img src="assets/catch_sports_logo.png" alt="Catch Sports Logo" style="height: 32px; width: 32px; border-radius: 50%; object-fit: cover;">
      </div>
      <div class="logo-text">CATCH <span>SPORTS</span></div>
    </a>
    <a href="index.html" class="btn btn-outline" style="font-size: 12px; padding: 8px 16px;">Ver Tienda</a>
  </nav>

  <!-- Main Content -->
  <main class="container" style="margin-top: 40px;">
    <h1 class="page-title" style="font-size: 32px; margin-bottom: 8px;">Panel de Administración</h1>
    <p class="page-subtitle">Sube nuevos productos al catálogo</p>

    <!-- Admin Login Section -->
    <div id="loginSection" class="admin-card" style="display: none;">
      <h2>Iniciar Sesión</h2>
      <p class="text-secondary" style="margin-bottom: 24px;">Acceso exclusivo para administradores.</p>
      
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="adminEmail" class="form-control" placeholder="admin@tienda.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="adminPassword" class="form-control" placeholder="••••••••">
      </div>
      
      <div id="loginError" style="color: #ff6b6b; font-size: 14px; margin-bottom: 16px; display: none;"></div>
      <button id="btnLogin" class="btn" style="width: 100%;">Entrar</button>
    </div>

    <!-- Add Product Form -->
    <div id="adminSection" class="admin-card" style="display: none;">
      <h2>Agregar Producto</h2>
      
      <form id="productForm">
        <div class="form-group">
          <label>Nombre del Producto</label>
          <input type="text" id="prodName" class="form-control" required placeholder="Ej. Jersey Oficial 2026">
        </div>
        
        <div class="form-group">
          <label>Equipo / Categoría</label>
          <select id="prodTeam" class="form-control" required>
            <!-- Options will be populated dynamically from teams.js -->
          </select>
        </div>
        
        <div class="form-group">
          <label>Precio (MXN)</label>
          <input type="number" id="prodPrice" class="form-control" required placeholder="Ej. 1500" min="0" step="0.01">
        </div>
        
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="prodDesc" class="form-control" required placeholder="Detalles del artículo..."></textarea>
        </div>
        
        <div class="form-group">
          <label>Imagen del Producto</label>
          <input type="file" id="prodImage" class="form-control" required accept="image/*" style="padding: 10px;">
          
          <!-- Image Preview -->
          <div style="margin-top: 16px; text-align: center;">
            <img id="imagePreview" src="" style="max-width: 200px; border-radius: 8px; display: none; border: 1px solid var(--border-color);">
          </div>
        </div>
        
        <div id="uploadStatus" style="font-size: 14px; margin-bottom: 16px; font-weight: bold;"></div>
        
        <button type="submit" id="btnSubmit" class="btn" style="width: 100%;">Subir Producto</button>
        <button type="button" id="btnLogout" class="btn btn-outline" style="width: 100%; margin-top: 12px;">Cerrar Sesión</button>
      </form>
    </div>
    
    <!-- Product List Management -->
    <div id="manageSection" class="admin-card" style="display: none; margin-top: 24px;">
      <h2>Tus Productos</h2>
      <p class="text-secondary" style="margin-bottom: 16px;">Administra o elimina los productos publicados.</p>
      
      <div id="adminProductList" style="display: flex; flex-direction: column; gap: 12px;">
        <!-- Admin products will be injected here -->
      </div>
    </div>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  
  <script src="js/firebase-config.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
